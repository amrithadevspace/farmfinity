<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishi Bhavan Register</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#d4fc79,#96e6a1,#b7e4c7,#95d5b2);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    padding:40px 20px;
    overflow-x:hidden;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Leaves */

body::before,
body::after{
    content:"🌿";
    position:fixed;
    font-size:42px;
    opacity:.18;
    pointer-events:none;
    animation:leafFall 12s linear infinite;
}

body::before{
    left:8%;
    top:-10%;
}

body::after{
    right:10%;
    animation-delay:6s;
}

@keyframes leafFall{
    from{
        transform:translateY(-120px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

/* Back Button */

.back-btn{
    position:fixed;
    top:25px;
    left:25px;
    text-decoration:none;
    background:#2e7d32;
    color:#fff;
    padding:12px 22px;
    border-radius:30px;
    font-weight:600;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.back-btn:hover{
    background:#1b5e20;
    transform:translateY(-3px);
}

/* Form Card */

.form-card{
    width:100%;
    max-width:760px;
    background:rgba(255,255,255,.96);
    padding:35px;
    border-radius:22px;
    box-shadow:0 18px 40px rgba(0,0,0,.18);
    animation:fadeIn .8s;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h3{
    text-align:center;
    color:#1b5e20;
    font-size:30px;
    margin-bottom:30px;
    font-weight:700;
}

table{
    width:100%;
}

td{
    padding:10px;
    vertical-align:top;
}

td:first-child{
    width:38%;
    font-weight:600;
    color:#2e7d32;
}

input[type=text],
input[type=password],
select,
input[type=file]{
    width:100%;
    padding:12px 15px;
    border:2px solid #c8e6c9;
    border-radius:12px;
    background:#f9fff9;
    font-size:15px;
    transition:.3s;
}

input:focus,
select:focus{
    outline:none;
    border-color:#43a047;
    box-shadow:0 0 10px rgba(67,160,71,.25);
}

input[type=file]{
    background:white;
    cursor:pointer;
}

input[type=submit]{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#43a047,#2e7d32);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

input[type=submit]:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(46,125,50,.35);
}

@media(max-width:768px){

.form-card{
    padding:25px;
}

table,
tbody,
tr,
td{
    display:block;
    width:100%;
}

td{
    padding:8px 0;
}

td:first-child{
    margin-top:10px;
}

h3{
    font-size:24px;
}

}
    /* VALID INPUT */

input:focus:valid,
select:focus:valid{

    border-color:#43a047;
    box-shadow:0 0 10px rgba(67,160,71,.25);

}


/* INVALID INPUT */

input:focus:invalid,
select:focus:invalid{

    border-color:red;
    box-shadow:0 0 10px rgba(255,0,0,.25);

}
    /* VALID INPUT */

input:focus:valid,
select:focus:valid{

    border-color:#43a047;
    box-shadow:0 0 10px rgba(67,160,71,.25);

}


/* INVALID INPUT */

input:focus:invalid,
select:focus:invalid{

    border-color:red;
    box-shadow:0 0 10px rgba(255,0,0,.25);

}

</style>

</head>

<body>

<a href="/temp/home/" class="back-btn">← Back Home</a>

<div class="form-card">

<form method="post" enctype="multipart/form-data">
{% csrf_token %}

<h3>🌾 Krishi Bhavan Registration</h3>

<table>

<tr>
<td>Krishibhavan Name</td>
<td>
<input type="text"
name="krishibhavan name"
placeholder="Enter Krishi Bhavan Name"
required
pattern="[A-Za-z ]{3,50}"
title="Only letters are allowed (3-50 characters).">
</td>
</tr>


<tr>
<td>Officer Name</td>
<td>
<input type="text"
name="officer name"
placeholder="Enter Officer Name"
required
pattern="[A-Za-z ]{3,30}"
title="Only letters are allowed (3-30 characters).">
</td>
</tr>


<tr>
<td>Service Area</td>
<td>
<input type="text"
name="service area"
placeholder="Enter Service Area"
required
pattern="[A-Za-z ]{3,40}"
title="Only letters are allowed (3-40 characters).">
</td>
</tr>


<tr>
<td>Place</td>
<td>
<input type="text"
name="place"
placeholder="Enter Place"
required
pattern="[A-Za-z ]{3,30}"
title="Only letters are allowed (3-30 characters).">
</td>
</tr>


<tr>
<td>District</td>
<td>

<select name="district" required>

<option value="">Select District</option>

<option value="kasarkode">Kasarkode</option>
<option value="kannur">Kannur</option>
<option value="vayanad">Vayanad</option>
<option value="calicut">Calicut</option>
<option value="malappuram">Malappuram</option>
<option value="palakkad">Palakkad</option>
<option value="thrissur">Thrissur</option>
<option value="ernakulam">Ernakulam</option>
<option value="idukki">Idukki</option>
<option value="kottayam">Kottayam</option>
<option value="alappuzha">Alappuzha</option>
<option value="pathanamthitta">Pathanamthitta</option>
<option value="kollam">Kollam</option>
<option value="trivandrum">Trivandrum</option>

</select>

</td>
</tr>


<tr>
<td>PIN Code</td>
<td>
<input type="text"
name="pin"
placeholder="Enter PIN Code"
required
pattern="[0-9]{6}"
maxlength="6"
title="PIN Code must contain exactly 6 digits.">
</td>
</tr>


<tr>
<td>Office Address</td>
<td>
<input type="text"
name="office address"
placeholder="Enter Office Address"
required
minlength="5"
title="Please enter a valid office address.">
</td>
</tr>


<tr>
<td>Photo</td>
<td>
<input type="file"
name="photo"
accept=".jpg,.jpeg,.png"
required>
</td>
</tr>


<tr>
<td>Username</td>
<td>
<input type="text"
name="username"
placeholder="Enter Username"
required
pattern="[A-Za-z0-9_]{4,15}"
title="Username must contain 4-15 characters.">
</td>
</tr>


<tr>
<td>Password</td>
<td>
<input type="password"
name="password"
placeholder="Enter Password"
required
pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
title="Password must contain at least one uppercase letter, one lowercase letter and one number.">
</td>
</tr>


<tr>
<td></td>
<td>
<input type="submit" value="REGISTER">
</td>
</tr>

</table>
</form>

</div>

</body>
</html>
