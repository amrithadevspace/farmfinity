<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Notification</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    padding:30px;
    background:linear-gradient(-45deg,#d4fc79,#96e6a1,#c8e6c9,#e8f5e9);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Leaves */

body::before,
body::after{
    content:"🍃";
    position:fixed;
    font-size:38px;
    opacity:.15;
    pointer-events:none;
    animation:leafFall 12s linear infinite;
}

body::before{
    left:8%;
    top:-10%;
}

body::after{
    right:10%;
    animation-delay:6s;
}

@keyframes leafFall{

0%{
transform:translateY(-120px) rotate(0deg);
}

100%{
transform:translateY(110vh) rotate(360deg);
}

}

/* Header */

.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;

}

.back-btn{

text-decoration:none;
background:#2e7d32;
color:white;
padding:12px 22px;
border-radius:30px;
font-weight:600;
box-shadow:0 8px 20px rgba(0,0,0,.18);
transition:.3s;

}

.back-btn:hover{

background:#1b5e20;
transform:translateY(-3px);

}

.header h2{

font-size:32px;
color:#1b5e20;
font-weight:700;

}

/* Table */

.table-container{

background:rgba(255,255,255,.95);
padding:25px;
border-radius:20px;
overflow-x:auto;
box-shadow:0 15px 35px rgba(0,0,0,.15);
animation:fadeIn .8s;

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

table{

width:100%;
border-collapse:collapse;
min-width:800px;

}

th{

background:#2e7d32;
color:white;
padding:15px;
font-size:15px;

}

td{

padding:14px;
text-align:center;
border-bottom:1px solid #ddd;
color:#444;

}

tr:nth-child(even){

background:#f8fff8;

}

tr:hover{

background:#e8f5e9;
transition:.3s;

}

/* Notification Cell */

.notification{

text-align:left;
max-width:450px;
line-height:1.6;

}

@media(max-width:768px){

.header{

flex-direction:column;
gap:15px;

}

.header h2{

font-size:24px;

}

.back-btn{

align-self:flex-start;

}

}

</style>

</head>

<body>

<div class="header">

<a href="/temp/user/" class="back-btn">← Back Home</a>

<h2>📢 View Notifications</h2>

</div>

<div class="table-container">

<table>

<tr>

<th>Date</th>
<th>Krishibhavan</th>
<th>Notification</th>

</tr>

{% for i in aa %}

<tr>

<td>{{ i.date }}</td>
<td>{{ i.krishibhavan.krishibhavan_name }}</td>
<td>{{ i.notification }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
