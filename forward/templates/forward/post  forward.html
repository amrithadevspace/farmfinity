<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forward Complaint</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    background:linear-gradient(-45deg,#d4fc79,#96e6a1,#c8e6c9,#e8f5e9);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
}

/* Background Animation */

@keyframes bgAnimation{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}


/* Floating Leaves */

body::before,
body::after{
    content:"🍃";
    position:fixed;
    font-size:40px;
    opacity:.15;
    pointer-events:none;
    animation:leafFall 12s linear infinite;
}

body::before{
    left:8%;
    top:-10%;
}

body::after{
    right:10%;
    animation-delay:6s;
}


@keyframes leafFall{
    from{
        transform:translateY(-120px) rotate(0deg);
    }

    to{
        transform:translateY(110vh) rotate(360deg);
    }
}


/* Back Home Button */

.back-btn{
    position:fixed;
    top:25px;
    left:25px;
    text-decoration:none;
    background:#2E7D32;
    color:white;
    padding:12px 22px;
    border-radius:30px;
    font-weight:600;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    transition:.3s;
}

.back-btn:hover{
    background:#1B5E20;
    transform:translateY(-3px);
}


/* Form Card */

.form-card{
    width:100%;
    max-width:550px;
    background:rgba(255,255,255,.96);
    padding:35px;
    border-radius:25px;
    box-shadow:0 18px 40px rgba(0,0,0,.15);
    animation:fadeIn .8s;
}


@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


h3{
    text-align:center;
    color:#1B5E20;
    font-size:30px;
    font-weight:700;
    margin-bottom:30px;
}


table{
    width:100%;
}

td{
    padding:12px;
}

td:first-child{
    width:35%;
    color:#2E7D32;
    font-weight:600;
}


/* Select Box */

select{
    width:100%;
    padding:12px;
    border:2px solid #C8E6C9;
    border-radius:12px;
    background:#F8FFF8;
    font-size:15px;
    transition:.3s;
}

select:focus{
    outline:none;
    border-color:#43A047;
    box-shadow:0 0 10px rgba(67,160,71,.25);
}


/* Submit Button */

input[type="submit"]{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#43A047,#2E7D32);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

input[type="submit"]:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(46,125,50,.3);
}


/* Responsive */

@media(max-width:768px){

    .form-card{
        padding:25px;
    }

    table,
    tbody,
    tr,
    td{
        display:block;
        width:100%;
    }

    td{
        padding:8px 0;
    }

    td:first-child{
        margin-top:10px;
    }

    h3{
        font-size:24px;
    }

}

</style>
</head>

<body>

<!-- Back Home Button -->

<a href="/temp/admin/" class="back-btn">
    ← Back Home
</a>


<!-- Form -->

<div class="form-card">

<form method="post">

{% csrf_token %}

<h3>🌾 Forward Complaint</h3>

<table>

<tr>
<td>Farmer Name</td>

<td>
<select name="yy">

{% for i in aa %}

<option value="{{ i.farmer_id }}">
    {{ i.farmer_name }}
</option>

{% endfor %}

</select>
</td>
</tr>


<tr>
<td></td>

<td>
<input type="submit" value="FORWARD">
</td>
</tr>

</table>

</form>

</div>

</body>
</html>
