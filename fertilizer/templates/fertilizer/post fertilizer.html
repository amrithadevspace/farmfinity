<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Fertilizer Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#d4fc79,#96e6a1,#b7e4c7,#95d5b2);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    padding:40px 20px;
    overflow-x:hidden;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Leaves */

body::before,
body::after{
    content:"🌿";
    position:fixed;
    font-size:40px;
    opacity:.18;
    animation:leaf 12s linear infinite;
    pointer-events:none;
}

body::before{
    left:8%;
    top:-10%;
}

body::after{
    right:10%;
    animation-delay:6s;
}

@keyframes leaf{

0%{
transform:translateY(-120px) rotate(0deg);
}

100%{
transform:translateY(110vh) rotate(360deg);
}

}

/* Back Button */

.back-btn{

position:fixed;
top:25px;
left:25px;
text-decoration:none;
background:#2e7d32;
color:white;
padding:12px 22px;
border-radius:30px;
font-weight:600;
transition:.3s;
box-shadow:0 8px 20px rgba(0,0,0,.18);

}

.back-btn:hover{

background:#1b5e20;
transform:translateY(-3px);

}

/* Form Card */

.form-card{

width:100%;
max-width:700px;
background:rgba(255,255,255,.96);
padding:35px;
border-radius:22px;
box-shadow:0 18px 40px rgba(0,0,0,.18);
animation:fadeIn .8s;

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}

h3{

text-align:center;
color:#1b5e20;
margin-bottom:30px;
font-size:30px;
font-weight:700;

}

table{

width:100%;

}

td{

padding:10px;
vertical-align:top;

}

td:first-child{

width:38%;
font-weight:600;
color:#2e7d32;

}

input[type=text],
select,
textarea,
input[type=file]{

width:100%;
padding:12px 15px;
border:2px solid #c8e6c9;
border-radius:12px;
font-size:15px;
background:#f9fff9;
transition:.3s;

}

textarea{

resize:none;

}

input:focus,
select:focus,
textarea:focus{

outline:none;
border-color:#43a047;
box-shadow:0 0 10px rgba(67,160,71,.25);

}

input[type=file]{

background:white;
cursor:pointer;

}

input[type=submit]{

width:100%;
padding:14px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#43a047,#2e7d32);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;

}

input[type=submit]:hover{

transform:translateY(-3px);
box-shadow:0 10px 25px rgba(46,125,50,.35);

}

@media(max-width:768px){

.form-card{
padding:25px;
}

table,
tbody,
tr,
td{
display:block;
width:100%;
}

td{
padding:8px 0;
}

td:first-child{
margin-top:10px;
}

h3{
font-size:24px;
}

}

</style>

</head>

<body>

<a href="/temp/krishibhavan/" class="back-btn">← Back Home</a>

<div class="form-card">

<form method="post">

{% csrf_token %}

<h3>🌱 Add Fertilizer Details</h3>

<table>

<tr>
<td>Fertilizer Name</td>
<td><input type="text" name="fertilizer name" placeholder="Enter fertilizer name"></td>
</tr>

<tr>
<td>Type</td>
<td>
<select name="type" required>
<option value="select">Select</option>
<option value="organic">Organic</option>
<option value="chemical">Chemical</option>
<option value="bio">Bio</option>
<option value="liquid">Liquid</option>
<option value="compost">Compost</option>
</select>
</td>
</tr>

<tr>
<td>Description</td>
<td><textarea rows="4" name="description" placeholder="Enter fertilizer description"></textarea></td>
</tr>

<tr>
<td>Price</td>
<td><input type="text" name="price" placeholder="Enter price"></td>
</tr>

<tr>
<td>Unit</td>
<td><input type="text" name="unit" placeholder="Eg: Kg, Litre, Bag"></td>
</tr>

<tr>
<td>Phone Number</td>
<td><input type="text" name="phone" placeholder="Enter phone number"></td>
</tr>

<tr>
<td>Manufacturing Company</td>
<td><input type="text" name="manufacturing" placeholder="Enter company name"></td>
</tr>

<tr>
<td>Photo</td>
<td><input type="file" name="photo"></td>
</tr>

<tr>
<td></td>
<td><input type="submit" value="SUBMIT"></td>
</tr>

</table>

</form>

</div>

</body>
</html>
