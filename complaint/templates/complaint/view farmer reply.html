<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Farmer Reply</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    padding:40px;
    background:linear-gradient(-45deg,#d4fc79,#96e6a1,#b7e4c7,#95d5b2);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

body::before,
body::after{
    content:"🌿";
    position:fixed;
    font-size:40px;
    opacity:.15;
    animation:leaf 12s linear infinite;
}

body::before{
    left:8%;
    top:-10%;
}

body::after{
    right:10%;
    animation-delay:6s;
}

@keyframes leaf{
    from{
        transform:translateY(-120px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    background:#2e7d32;
    color:#fff;
    text-decoration:none;
    padding:12px 22px;
    border-radius:30px;
    font-weight:600;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.back-btn:hover{
    background:#1b5e20;
    transform:translateY(-3px);
}

.container{
    max-width:900px;
    margin:70px auto 0;
    background:rgba(255,255,255,.96);
    padding:30px;
    border-radius:22px;
    box-shadow:0 20px 45px rgba(0,0,0,.18);
    animation:fadeIn .8s;
    overflow-x:auto;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h3{
    text-align:center;
    color:#1b5e20;
    font-size:30px;
    margin-bottom:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2e7d32;
    color:white;
    padding:15px;
    font-size:16px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #dcedc8;
}

tr:nth-child(even){
    background:#f7fff7;
}

tr:hover{
    background:#ecf8ec;
    transition:.3s;
}

@media(max-width:768px){

.container{
    padding:20px;
}

h3{
    font-size:24px;
}

table{
    min-width:600px;
}

}

</style>

</head>

<body>

<a href="/temp/user/" class="back-btn">← Back Home</a>

<div class="container">

<h3>💬 View Farmer Reply</h3>

<table>

<tr>
    <th>Complaint</th>
    <th>Reply</th>
</tr>

{% for i in aa %}

<tr>
    <td>{{ i.complaint }}</td>
    <td>{{ i.reply }}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
