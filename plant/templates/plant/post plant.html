<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Plant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#d4fc79,#96e6a1,#b7e4c7,#95d5b2);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

/* background animation */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* floating plant effect */
body::before,
body::after{
    content:"🌱";
    position:absolute;
    font-size:45px;
    opacity:.18;
    animation:floatPlant 12s linear infinite;
}

body::before{
    left:8%;
    top:-10%;
}

body::after{
    right:10%;
    animation-delay:6s;
}

@keyframes floatPlant{
    0%{transform:translateY(-120px) rotate(0deg);}
    100%{transform:translateY(110vh) rotate(360deg);}
}

/* back button */
.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    text-decoration:none;
    background:#2e7d32;
    color:white;
    padding:12px 20px;
    border-radius:30px;
    font-weight:600;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
    transition:.3s;
}

.back-btn:hover{
    background:#1b5e20;
    transform:translateY(-3px);
}

/* card */
.form-card{
    width:100%;
    max-width:650px;
    background:rgba(255,255,255,.96);
    padding:35px;
    border-radius:22px;
    box-shadow:0 20px 45px rgba(0,0,0,.18);
    animation:fadeIn .8s;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

h3{
    text-align:center;
    color:#1b5e20;
    margin-bottom:25px;
    font-size:30px;
    font-weight:700;
}

/* table form */
table{
    width:100%;
}

td{
    padding:10px;
}

td:first-child{
    width:40%;
    font-weight:600;
    color:#2e7d32;
}

input[type=text],
select,
textarea{
    width:100%;
    padding:12px;
    border:2px solid #c8e6c9;
    border-radius:12px;
    background:#f9fff9;
    font-size:14px;
    transition:.3s;
}

textarea{
    resize:none;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#43a047;
    box-shadow:0 0 10px rgba(67,160,71,.25);
}

input[type=submit]{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#43a047,#2e7d32);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

input[type=submit]:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(46,125,50,.35);
}

/* responsive */
@media(max-width:768px){

body{
    padding:20px;
}

.form-card{
    padding:25px;
}

table,
tr,
td{
    display:block;
    width:100%;
}

td{
    padding:6px 0;
}

td:first-child{
    margin-top:10px;
}

h3{
    font-size:24px;
}

}

</style>

</head>

<body>

<a href="/temp/krishibhavan/" class="back-btn">← Back Home</a>

<div class="form-card">

<form method="post">

{% csrf_token %}

<h3>🌱 Add Plant Details</h3>

<table>

<tr>
<td>Plant Name</td>
<td><input type="text" name="plant name"></td>
</tr>

<tr>
<td>Category</td>
<td>
<select name="category" required>
<option value="select">Select</option>
<option value="vegetable">Vegetable</option>
<option value="fruit">Fruit</option>
<option value="Medicinal">Medicinal</option>
<option value="flower">Flower</option>
<option value="spice">Spice</option>
</select>
</td>
</tr>

<tr>
<td>Description</td>
<td><textarea rows="3" name="description"></textarea></td>
</tr>

<tr>
<td>Growing Season</td>
<td><input type="text" name="season"></td>
</tr>

<tr>
<td>Phone Number</td>
<td><input type="text" name="phone"></td>
</tr>

<tr>
<td>Photo</td>
<td><input type="file" name="photo"></td>
</tr>

<tr>
<td>Price</td>
<td><input type="text" name="price"></td>
</tr>

<tr>
<td></td>
<td><input type="submit" value="SUBMIT"></td>
</tr>

</table>

</form>

</div>

</body>
</html>
