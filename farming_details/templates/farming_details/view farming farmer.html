<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Farming Method</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    padding:35px;
    background:linear-gradient(-45deg,#d4fc79,#96e6a1,#c8e6c9,#e8f5e9);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

body::before,
body::after{
    content:"🍃";
    position:fixed;
    font-size:38px;
    opacity:.18;
    animation:leafFall 12s linear infinite;
    pointer-events:none;
}

body::before{
    left:8%;
    top:-10%;
}

body::after{
    right:10%;
    animation-delay:6s;
}

@keyframes leafFall{
    from{
        transform:translateY(-120px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.back-btn{
    text-decoration:none;
    background:linear-gradient(135deg,#43a047,#2e7d32);
    color:#fff;
    padding:12px 24px;
    border-radius:30px;
    font-weight:600;
    box-shadow:0 10px 20px rgba(0,0,0,.18);
    transition:.3s;
}

.back-btn:hover{
    transform:translateY(-3px);
    background:linear-gradient(135deg,#2e7d32,#1b5e20);
}

.header h2{
    color:#1b5e20;
    font-size:34px;
    font-weight:700;
}

.table-container{
    background:rgba(255,255,255,.95);
    padding:25px;
    border-radius:22px;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
    overflow-x:auto;
    animation:fadeIn .8s;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

table{
    width:100%;
    min-width:1200px;
    border-collapse:collapse;
}

th{
    background:linear-gradient(135deg,#2e7d32,#43a047);
    color:#fff;
    padding:16px;
    font-size:15px;
    letter-spacing:.5px;
}

td{
    padding:16px;
    text-align:center;
    border-bottom:1px solid #e0e0e0;
    vertical-align:middle;
}

tr:nth-child(even){
    background:#f8fff8;
}

tr:hover{
    background:#e8f5e9;
    transition:.3s;
}

video{
    width:220px;
    height:140px;
    border-radius:15px;
    border:3px solid #43a047;
    object-fit:cover;
    box-shadow:0 8px 18px rgba(0,0,0,.18);
}

.article-btn{
    display:inline-block;
    text-decoration:none;
    background:linear-gradient(135deg,#43a047,#2e7d32);
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-weight:600;
    transition:.3s;
}

.article-btn:hover{
    background:linear-gradient(135deg,#2e7d32,#1b5e20);
    transform:translateY(-3px);
    color:#fff;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-weight:600;
    margin:4px;
    transition:.3s;
}

.accept{
    background:linear-gradient(135deg,#4caf50,#2e7d32);
}

.accept:hover{
    transform:translateY(-3px);
}

.reject{
    background:linear-gradient(135deg,#ef5350,#c62828);
}

.reject:hover{
    transform:translateY(-3px);
}

.status{
    color:#2e7d32;
    font-weight:700;
}

.no-file{
    color:#f44336;
    font-weight:600;
}

@media(max-width:768px){

.header{
    flex-direction:column;
    gap:15px;
}

.header h2{
    font-size:24px;
}

.back-btn{
    align-self:flex-start;
}

video{
    width:180px;
    height:120px;
}

}
</style>

</head>

<body>

<div class="header">

<a href="/temp/user/" class="back-btn">← Back Home</a>

<h2>🌾 View Farming Method by Farmer</h2>

</div>

<div class="table-container">

<table>

<tr>
    <th>👨‍🌾 Farmer</th>
    <th>🌱 Crop</th>
    <th>📝 Description</th>
    <th>🎥 Video</th>
    <th>📄 Article</th>
</tr>
{% for i in aa %}

<tr>

    <td>
        <div class="farmer-name">
            👨‍🌾 {{ i.farmer.farmer_name }}
        </div>
    </td>

    <td>
        <span class="crop-badge">
            🌾 {{ i.crop_name }}
        </span>
    </td>

    <td class="description">
        {{ i.discription }}
    </td>

   <td>
    <video width="220" height="140" controls>
        <source src="/static/{{ i.video }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</td>
    <td>
        {% if i.article %}
        <a href="/static/{{ i.article }}" target="_blank" class="article-btn">
            📄 Read Article
        </a>
        {% else %}
        <span class="no-file">No Article</span>
        {% endif %}
    </td>

</tr>
{% endfor %}

</table>

</div>

</body>
</html>
